<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Note</title>
    <link rel="stylesheet" href="./src/output.css">
    <link rel="shortcut icon" href="./Image/android-chrome-512x512.png" type="image/x-icon">
    <link rel="manifest" href="./manifest.json">
</head>

<body class="bg-[#051424] px-5 text-white  ">
    <!-- #0f172b -->
    <nav class="bg-[#0d1c2d] py-3 px-4 w-full my-5 rounded-2xl border-2 border-blue-800/8 border-double">
        <div class="flex items-center gap-1.5 ">

            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF">
                <path
                    d="M380-360q42 0 71-29l160-160q29-29 29-71t-29-71q-29-29-71-29t-71 29q-37-13-73-6t-61 32q-25 25-32 61t6 73q-29 29-29 71t29 71q29 29 71 29ZM240-80v-172q-57-52-88.5-121.5T120-520q0-150 105-255t255-105q125 0 221.5 73.5T827-615l52 205q5 19-7 34.5T840-360h-80v120q0 33-23.5 56.5T680-160h-80v80h-80v-160h160v-200h108l-38-155q-23-91-98-148t-172-57q-116 0-198 81t-82 197q0 60 24.5 114t69.5 96l26 24v208h-80Zm254-360Z" />
            </svg>

            <h2 class="text-2xl font-semibold">Brain Note</h2>
        </div>
    </nav>

    <div class="my-3 px-5 py-2 rounded-2xl gap-3 flex flex-col justify-between items-center sm:flex-row bg-[#0d1c2d] border-2 border-blue-800/8 border-double">
        <div class="flex items-center gap-2 ">
            <label for="inputTime">Reset in (seconds):</label>
            <input type="number" name=""
                class="outline-none border-none focus:outline-none focus:ring-0 bg-blue-300/20 rounded-lg w-10 h-8 p-2"
                id="inputTime" value="5">

            <!-- <div class="w-full bg-amber-600 h-2 rounded-2xl"></div> -->
        </div>
        <div class="flex items-center gap-2 bg-[#122131] px-3 py-2 rounded-xl border border-amber-50/10">
            <p>Time Remaining : </p>
            <p id="timediv" class="font-medium">5</p>
        </div>
    </div>

    <div class="w-ful ">
        <textarea rows="12"
            class="outline-none focus:outline-none focus:ring-0 w-full p-3 bg-[#0d1c2d] rounded-2xl border-2 border-blue-800/8 border-double "
            id="noteInput" placeholder="Enter your note here.... Let your thoughts flow."></textarea>
    </div>

    <div class="flex justify-between gap-2  py-2">
        <div class="flex gap-2">
            <button class="bg-red-600 px-3 py-1.5 rounded-lg font-medium cursor-pointer flex gap-1.5 items-center"
                id="stopBtn">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="20px"
                    fill="#FFFFFF">
                    <path
                        d="M320-320h320v-320H320v320ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z" />
                </svg>
                Stop</button>
            <button class="bg-blue-600 px-3 py-1.5 rounded-lg font-medium cursor-pointer flex gap-1.5 items-center"
                id="copyBtn">
                <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="24px"
                    fill="#FFFFFF">
                    <path
                        d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z" />
                </svg>
                Copy</button>
        </div>


        <button class="bg-lime-800 px-3 py-1.5 rounded-lg font-medium cursor-pointer flex gap-1.5 items-center"
            id="startBtn">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="20px" fill="#FFFFFF">
                <path
                    d="m380-300 280-180-280-180v360ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z" />
            </svg>

            Start</button>
    </div>


    <script src="index.js"></script>
</body>

</html>
