<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Note</title>
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-slate-900 text-white ">

    <nav class="bg-slate-700 py-3 px-2 w-screen mb-5">
        <div class="flex items-center gap-1.5">

            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF">
                <path
                    d="M380-360q42 0 71-29l160-160q29-29 29-71t-29-71q-29-29-71-29t-71 29q-37-13-73-6t-61 32q-25 25-32 61t6 73q-29 29-29 71t29 71q29 29 71 29ZM240-80v-172q-57-52-88.5-121.5T120-520q0-150 105-255t255-105q125 0 221.5 73.5T827-615l52 205q5 19-7 34.5T840-360h-80v120q0 33-23.5 56.5T680-160h-80v80h-80v-160h160v-200h108l-38-155q-23-91-98-148t-172-57q-116 0-198 81t-82 197q0 60 24.5 114t69.5 96l26 24v208h-80Zm254-360Z" />
            </svg>

            <h2 class="text-2xl font-semibold">Brain Note</h2>
        </div>
    </nav>

    <div class="my-3 px-5 gap-1.5 flex flex-col justify-between sm:flex-row">
        <div class="flex items-center gap-2 ">
            <label for="inputTime">Reset in (seconds):</label>
            <input type="number" name=""
                class="outline-none border-none focus:outline-none focus:ring-0 bg-blue-300/20 rounded-lg w-25 h-8 p-2"
                id="inputTime" value="5">
            
            <!-- <div class="w-full bg-amber-600 h-2 rounded-2xl"></div> -->
        </div>
        <div class="flex items-center gap-2" >
            <p>Time Remaining : </p>
            <p id="timediv" class="font-medium" >5</p>
        </div>
    </div>

    <div class="w-screen px-5">
        <textarea rows="18"
            class="outline-none border-none focus:outline-none focus:ring-0 w-full p-3 bg-blue-300/40 rounded-2xl  "
            id="noteInput" placeholder="Enter your note here"></textarea>
    </div>

    <div class="flex justify-between gap-2 px-5 py-2">
        <div>
            <button class="bg-red-600 px-4 py-1.5 rounded-lg font-medium cursor-pointer" id="stopBtn">Stop</button>
        <button class="bg-blue-600 px-4 py-1.5 rounded-lg font-medium cursor-pointer" id="copyBtn">Copy</button>
        </div>
        

        <button class="bg-lime-800 px-4 py-1.5 rounded-lg font-medium cursor-pointer" id="startBtn">Start</button>
    </div>


    <script src="index.js"></script>
</body>

</html>
